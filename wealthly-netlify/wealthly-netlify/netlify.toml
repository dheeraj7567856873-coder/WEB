[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Pins the deploy target to Netlify (Lovable builds stay on their own target).
  NITRO_PRESET = "netlify"
  # Public backend config (publishable keys — safe to ship to the browser).
  VITE_SUPABASE_URL = "https://kpyvemqbcikxmdkistgx.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qr5RNHPpqFnq-_MTmKBHnA_jZF9i9CR"
  VITE_SUPABASE_PROJECT_ID = "kpyvemqbcikxmdkistgx"
  SUPABASE_URL = "https://kpyvemqbcikxmdkistgx.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qr5RNHPpqFnq-_MTmKBHnA_jZF9i9CR"
  SUPABASE_PROJECT_ID = "kpyvemqbcikxmdkistgx"

# Server-side rendering: every non-asset request goes to the generated server function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
